# dependabot.yml — mẫu cho dự án đích (`install.py --with-github` chép vào `.github/dependabot.yml`, copy-if-absent).
# Chỉ có hệ sinh thái chắc chắn tồn tại sau khi cài: GitHub Actions (`ci.yml`, `secret-scan.yml` ghim action theo SHA). Thêm một khối
# `updates` cho mỗi manifest thật của dự án (npm cho npm/pnpm/yarn, pip/uv, gomod, cargo, docker…) — khai hệ sinh thái mà
# repo không có manifest thì Dependabot báo lỗi ở mỗi lượt chạy. Luật: BASE-DEP-007 (cập nhật có nhịp, gom nhóm, trần PR).
version: 2
updates:
  # Nâng SHA của action đã ghim (uses: owner/repo@<sha> # vX.Y.Z); gom nhóm để không phình WIP.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    # Không nâng bản phát hành chưa đủ hai tuần (cập nhật bảo mật không bị cooldown). BASE-DEP-016 nêu 3–7 ngày làm ví dụ;
    # mẫu chọn 14 cho action vì action chạy với token của CI — bản bị rút/tiêm mã thường lộ ra trong tuần đầu.
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  # pnpm workspace: Dependabot dùng hệ sinh thái `npm` cho pnpm; mỗi manifest một khối (BASE-DEP-007, OPS-MAINT-001).
  # Gom minor+patch thành một PR; nâng MAJOR tách PR riêng (không vào group) để theo mẫu PR `major-upgrade` (OPS-MAINT-005).
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    cooldown: { default-days: 7 }
    labels: [dependencies]
    groups:
      root-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /apps/backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    cooldown: { default-days: 7 }
    labels: [dependencies]
    groups:
      backend-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /apps/storefront
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    cooldown: { default-days: 7 }
    labels: [dependencies]
    groups:
      storefront-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /packages/domain
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    cooldown: { default-days: 7 }
    labels: [dependencies]
    groups:
      domain-minor-patch: { update-types: [minor, patch] }
  # Base image của `Dockerfile` gốc (T-191, ghim tag + digest manifest list): Dependabot nâng cả tag lẫn digest. Node phải
  # khớp `.nvmrc` — PR nâng image đi kèm đổi `.nvmrc` trong cùng PR (xem ghi chú đầu Dockerfile). Image service CI nằm trong
  # `services:` của workflow — Dependabot không quét (digest ghim tay ở T-106). `scripts/check-dependabot.mjs` giữ khối này
  # khớp với Dockerfile thật (thêm/xoá Dockerfile → sửa file này cùng PR).
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    cooldown: { default-days: 7 }
    labels: [dependencies]
    groups:
      docker-minor-patch: { update-types: [minor, patch] }
