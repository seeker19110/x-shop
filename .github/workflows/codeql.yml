# SAST CodeQL cho JavaScript/TypeScript (SEC-WEB-001, BASE-SEC-007): bộ query `security-extended` (gồm js/sql-injection,
# js/path-injection, js/command-line-injection...). Chạy mỗi PR, push master và theo lịch tuần. Kết quả vào tab Security
# (code scanning). Muốn job này CHẶN merge: thêm `codeql / analyze (javascript-typescript)` vào required check của
# `.github/rulesets/main.json` (quyết định riêng — hiện chưa phải required check).
# Bổ trợ: `node scripts/check-sql-safety.mjs` (allowlist `knex.raw` có lý do).
name: codeql

on:
  pull_request: { branches: [master], types: [opened, synchronize, reopened] }
  push: { branches: [master] }
  schedule:
    - cron: "41 3 * * 1" # thứ Hai 03:41 UTC hằng tuần
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # github/codeql-action v4.39.1 — SHA commit của tag (annotated, lấy ^{}) xác minh 2026-10-26 bằng
      # `git ls-remote https://github.com/github/codeql-action refs/tags/v4.39.1`.
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:javascript-typescript"
