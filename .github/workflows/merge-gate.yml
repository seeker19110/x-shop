name: merge-gate

# STUB TẠM (D-122, ADR-0036): máy không bật auto-merge của GitHub nữa — mọi merge của máy ghim head sau `merge-check`, nên
# required check `merge-gate` (ADR-0023) hết lý do tồn tại. Job này chỉ giữ context `merge-gate` mà ruleset SỐNG của ba
# repo đã cài còn đòi: luôn xanh, không kiểm gì, không phải bằng chứng CI (`NON_CI_CHECKS`, AUD-HAR-058).
# Gỡ: chủ repo bỏ context khỏi ruleset sống ở cả ba repo, kiểm `gh api repos/<o>/<r>/rules/branches/main` không còn
# `merge-gate`, rồi T-1834 xoá file này. Xoá trước khi gỡ ruleset = mọi PR treo "Expected — merge-gate".
# Giữ `pull_request` TRẦN: thêm `branches:`/`paths:`/`types:` thì PR không khớp lọc (vd đổi nhánh đích) thiếu check-run
# trên head → treo. Không checkout, không action ngoài, không secret, token chỉ đọc (WF-CI-004, WF-CI-023).
on:
  pull_request:

permissions:
  contents: read

jobs:
  merge-gate:
    name: merge-gate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Stub giữ context required check (D-122) — luôn xanh
        run: |
          echo "merge-gate là stub tạm (D-122, ADR-0036): máy chỉ merge ghim head; T-1834 xoá khi ruleset sống đã gỡ context"
