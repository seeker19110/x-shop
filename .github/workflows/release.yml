# Phát hành SemVer tự động từ Conventional Commits (WF-REL-001, BASE-REPO-006, STD-PROC-002, WF-REL-003).
# release-please mở/cập nhật "Release PR" (bump version + CHANGELOG); khi người merge Release PR thì tạo tag `vX.Y.Z` + GitHub Release.
# Một nguồn phiên bản: package.json gốc (+ .release-please-manifest.json); package con được đồng bộ qua extra-files.
# Job `assets` đính kèm bản nén mã nguồn + SHA256SUMS vào Release. Không sửa tay số phiên bản trong PR tính năng.
# Tag `v*` bất biến: ruleset tag là việc thủ công của chủ repo (H-02, xem docs/ops/RELEASE.md) — workflow này không tạo ruleset.
# Lý do chạm .github: T-112 thêm workflow phát hành; permissions mặc định chỉ đọc, quyền ghi cấp riêng theo job.
# Action ghim SHA đầy đủ (xác minh 2026-10-26 bằng ls-remote): release-please-action v5.0.0, checkout v7.0.1.
name: release

on:
  push: { branches: [master] }
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # tạo tag + GitHub Release
      pull-requests: write # mở/cập nhật Release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    name: assets
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # đính tệp vào Release
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Đóng gói mã nguồn + checksum
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag không đúng SemVer: $TAG"; exit 1; }
          git archive --format=tar.gz --prefix="x-shop-${TAG}/" -o "x-shop-${TAG}.tar.gz" "$TAG"
          sha256sum "x-shop-${TAG}.tar.gz" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Đính vào GitHub Release
        run: gh release upload "$TAG" "x-shop-${TAG}.tar.gz" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
