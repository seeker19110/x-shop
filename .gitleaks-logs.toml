# Cấu hình gitleaks RIÊNG cho bước quét log test ở CI (SEC-SECRET-007, T-183). Kế thừa nguyên .gitleaks.toml (D-135).
# Một ngoại lệ, neo theo NGỮ CẢNH: log HTTP có `POST /auth/user/emailpass/reset-password trace_id=<uuid>` — từ khoá
# `password` trong đường dẫn khiến generic-api-key bắt nhầm UUID của trace_id. Chỉ bỏ qua đoạn khớp `trace_id=<uuid>`;
# không allowlist mọi UUID theo giá trị (token thật dạng UUID, vd token GHN, vẫn phải bị bắt). Chạy từ gốc repo
# (đường dẫn extend tính theo thư mục hiện hành).
title = "x-shop log scan"

[extend]
path = ".gitleaks.toml"

[[allowlists]]
description = "trace_id dạng UUID trong log HTTP không phải bí mật"
regexTarget = "match"
regexes = ['''trace_id=[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}''']
