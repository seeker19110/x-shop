# D-135: dùng toàn bộ luật mặc định của gitleaks, chỉ bỏ qua GIÁ TRỊ mang dấu hiệu giả của test.
# Không allowlist theo đường dẫn: bí mật thật lỡ dán vào file test vẫn bị bắt.
# Quy ước test: giá trị bí mật giả chứa `SENTINEL` hoặc dãy `0123456789` (không bí mật thật nào có dãy này).
# Giá trị giả khác (không theo quy ước) thêm theo fingerprint ở .gitleaksignore sau khi đọc giá trị.
title = "x-shop"

[extend]
useDefault = true

[allowlist]
description = "Giá trị bí mật giả trong test (D-135)"
regexTarget = "secret"
regexes = ['''SENTINEL''', '''0123456789''']
