# Quét bí mật mẫu cho dự án đích — `install.py --with-github` chép vào `.github/workflows/secret-scan.yml` (copy-if-absent).
# Job `gitleaks` là required check của ruleset mẫu. Không phụ thuộc stack.
name: Secret scan

# Luật "bí mật KHÔNG bao giờ vào Git" (01-baseline/security-minimum, 12-security/secrets-management):
# gitleaks quét TOÀN BỘ lịch sử (fetch-depth 0) trên push và PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# gitleaks-action đọc danh sách commit của PR qua API → cần pull-requests: read (thiếu → 403).
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action theo EULA độc quyền (gitleaks CLI mới là MIT): repo thuộc Organization Account phải có
          # secret GITLEAKS_LICENSE, cấm dùng như một phần dịch vụ; repo cá nhân không cần. Thay thế: CLI ghim phiên bản
          # + SHA256. Xem .xtemplates/framework/16-compliance-privacy/licensing-and-ip.md (xác minh 2026-10-21: research §4.2).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # ci-check-allow: chỉ khoá giấy phép quét, action ghim SHA, không chạy mã của PR
