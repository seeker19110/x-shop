# VÍ DỤ triển khai một máy bằng Docker Compose (T-191; BASE-SEC-010, ARC-RES-009, WF-ENV-006). KHÔNG phải quyết định hạ
# tầng production (việc của chủ dự án — docs/ops/RUNBOOK.md §8.1); container chỉ là định dạng artefact, thứ tự và biến vẫn
# theo RUNBOOK §8.2 và docs/ops/ENV.md.
#
# Chuẩn bị (file biến KHÔNG commit; mẫu và ý nghĩa từng biến ở docs/ops/ENV.md; bí mật lấy từ kho bí mật):
#   backend.env     — biến backend production (NODE_ENV=production, DATABASE_URL=postgres://xshop_app:…@postgres:5432/xshop,
#                     MIGRATION_DATABASE_URL=postgres://xshop_migrator:…@postgres:5432/xshop,
#                     REDIS_URL=redis://:<REDIS_PASSWORD>@redis:6379, JWT_SECRET, COOKIE_SECRET, FILE_STORAGE=s3, S3_*, VNPAY_*,
#                     GHN_*, XS_TRUSTED_PROXIES gồm mạng của storefront và reverse proxy…). KHÔNG đặt HOST/PORT/
#                     MEDUSA_WORKER_MODE ở đây — image và file này đã đặt.
#   storefront.env  — MEDUSA_BACKEND_URL=http://backend-server:9000, CATALOG_REVALIDATE_SECRET, XS_TRUST_PROXY_HEADERS…
#                     (NEXT_PUBLIC_* và XS_MEDIA_URL là THAM SỐ BUILD của image storefront, đặt ở đây không có tác dụng).
#   postgres.env    — POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB (superuser của cluster; ứng dụng KHÔNG dùng vai trò này —
#                     tạo xshop_app/xshop_migrator bằng scripts/db-roles.sql + db-app-grants.sql trước lần migrate đầu).
#   redis.env       — REDIS_PASSWORD (≥ 32 ký tự ngẫu nhiên; cùng giá trị trong REDIS_URL của backend.env).
#   Đường dẫn file đổi được qua biến XSHOP_*_ENV_FILE. Image ghim theo DIGEST (build một lần, đẩy cùng digest qua staging →
#   production — OPS-DEPLOY-001): XSHOP_BACKEND_IMAGE=<registry>/x-shop-backend@sha256:…,
#   XSHOP_STOREFRONT_IMAGE=<registry>/x-shop-storefront@sha256:….
#
# Chạy: docker compose -f compose.prod.example.yml up -d postgres redis
#       docker compose -f compose.prod.example.yml run --rm backend-migrate      # migrate TRƯỚC khi chạy bản mới (một lần)
#       docker compose -f compose.prod.example.yml up -d backend-server backend-worker storefront
#
# Mạng: Postgres và Redis chỉ ở mạng `data` (internal: không ra Internet, KHÔNG publish cổng ra máy chủ). Backend server và
# storefront chỉ publish lên 127.0.0.1 cho reverse proxy TLS trên cùng máy (proxy giữ nguyên Host — RUNBOOK §8.2a).
# Tắt êm: backend nhận SIGTERM → /x/readyz 503 trong SHUTDOWN_DRAIN_DELAY_MS → chờ request/job dở → thoát trong
# SHUTDOWN_TIMEOUT_MS (mặc định 25 s, schema apps/backend/src/lib/env/index.ts). stop_grace_period PHẢI lớn hơn giá trị đó
# (ở đây 35 s); tăng SHUTDOWN_TIMEOUT_MS thì tăng theo, nếu không Docker gửi SIGKILL giữa chừng.

name: x-shop

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-hardening: &hardening
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-backend: &backend
  <<: *hardening
  image: ${XSHOP_BACKEND_IMAGE:?đặt XSHOP_BACKEND_IMAGE=<registry>/x-shop-backend@sha256:<digest>}
  env_file:
    - path: ${XSHOP_BACKEND_ENV_FILE:-./backend.env}
      required: true
  # Mã chỉ đọc; /tmp là tmpfs. Production dùng FILE_STORAGE=s3 nên không cần volume file.
  read_only: true
  tmpfs:
    - /tmp
  stop_signal: SIGTERM
  stop_grace_period: 35s
  logging: *logging
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - data
    - egress

services:
  postgres:
    <<: *hardening
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    # Entrypoint của image cần đổi chủ thư mục dữ liệu rồi hạ quyền xuống user postgres.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    env_file:
      - path: ${XSHOP_POSTGRES_ENV_FILE:-./postgres.env}
        required: true
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Không có `ports:` — chỉ backend trong mạng `data` tới được (BASE-SEC-010).
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *logging
    networks:
      - data

  redis:
    <<: *hardening
    # D-147: 7.2 (BSD-3). Cùng digest với services của CI (.github/workflows/ci.yml).
    image: redis:7.2-alpine@sha256:2c933526722b4126a61d5c170f766dc159adf97682f0b1cbbc27b1666ba96d84
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    env_file:
      - path: ${XSHOP_REDIS_ENV_FILE:-./redis.env}
        required: true
    # Mật khẩu bắt buộc (đọc từ redis.env lúc chạy, không nội suy vào file này); AOF giữ hàng đợi BullMQ/workflow qua lần
    # khởi động lại; noeviction: BullMQ yêu cầu (không xoá khoá hàng đợi khi đầy bộ nhớ). Gọi lại docker-entrypoint.sh với
    # đối số đầu `redis-server` để entrypoint của image vẫn hạ quyền xuống user redis.
    entrypoint:
      - sh
      - -c
      - >-
        exec docker-entrypoint.sh redis-server --requirepass "$$REDIS_PASSWORD"
        --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    # Không có `ports:`.
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging
    networks:
      - data

  # Migration một lần (RUNBOOK §8.2 bước 1): `medusa db:migrate` kết nối bằng MIGRATION_DATABASE_URL (xshop_migrator).
  backend-migrate:
    <<: *backend
    command: ["db:migrate"]
    restart: "no"
    profiles: ["migrate"]

  backend-server:
    <<: *backend
    environment:
      MEDUSA_WORKER_MODE: server
    # Chỉ loopback của máy chủ: reverse proxy TLS phía trước. Đổi sang LB ngoài máy → bỏ `127.0.0.1:` nhưng giữ tường lửa.
    ports:
      - "127.0.0.1:9000:9000"
    restart: unless-stopped
    networks:
      - data
      - egress
      - app

  backend-worker:
    <<: *backend
    environment:
      MEDUSA_WORKER_MODE: worker
    # Không publish cổng: worker chỉ chạy job (outbox, reconcile, expire-holds…); healthcheck của image gọi /health.
    restart: unless-stopped

  storefront:
    <<: *hardening
    image: ${XSHOP_STOREFRONT_IMAGE:?đặt XSHOP_STOREFRONT_IMAGE=<registry>/x-shop-storefront@sha256:<digest>}
    env_file:
      - path: ${XSHOP_STOREFRONT_ENV_FILE:-./storefront.env}
        required: true
    ports:
      - "127.0.0.1:3000:3000"
    stop_signal: SIGTERM
    stop_grace_period: 35s
    depends_on:
      backend-server:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    networks:
      - app
      - egress

networks:
  # Postgres + Redis: không đường ra Internet, không cổng trên máy chủ.
  data:
    internal: true
  # Storefront ↔ backend server.
  app:
    internal: true
  # Đường ra ngoài (VNPAY, GHN, kho S3) cho backend và storefront.
  egress: {}

volumes:
  pgdata: {}
  redisdata: {}
