# vendors.yaml — sổ nhà cung cấp / bên xử lý (CMP-AUDIT-007). Kiểm bằng `node scripts/check-data-map.mjs`.
# - `id` được data-map.yaml tham chiếu ở `recipients`. `packages`: gói npm là SDK/adapter của nhà cung cấp đó (script chặn
#   SDK dịch vụ bên thứ ba chưa khai ở đây). Hiện x-shop gọi VNPAY và GHN bằng HTTP tự viết ở packages/domain/src/providers/
#   (không SDK), nên `packages` rỗng.
# - Thông tin pháp lý/hợp đồng chưa có = "chưa có" / "(chưa xác minh)" — KHÔNG điền suy đoán. Hạn rà soát <= 12 tháng.
updated: 2026-10-26
