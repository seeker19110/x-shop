openapi: 3.1.0
info:
  title: "x-shop custom API"
  version: 1.0.0
  summary: "Route tùy biến của x-shop trên Medusa v2 (store, admin, webhook)."
  description: |
    Hợp đồng máy đọc được cho các route TÙY BIẾN do dự án viết: `/store/x/*`, `/admin/x/*`, `/x/webhooks/*`, `/x/health` và `/x/readyz`.
    Route native của Medusa (`/store/carts`, `/auth/*`, `/admin/uploads`…) KHÔNG nằm ở đây — xem tài liệu Medusa.

    Nguồn sự thật: mã route `apps/backend/src/api/**/route.ts` (schema zod) và `docs/design/API-CONTRACT.md`;
    `scripts/check-openapi.mjs` (`pnpm check:openapi`) kiểm mỗi route file có đúng đường dẫn + phương thức ở đây và ngược lại.
    Khi mô tả lệch mã, mã + test tích hợp là chuẩn. Phần thân phản hồi phức tạp (báo cáo, danh sách quản trị) mô tả bằng
    các trường chính, `additionalProperties: true` — không phải danh sách đầy đủ.

    Quy ước chung:
    - Tiền: số nguyên VND. Thời gian: ISO 8601 UTC.
    - Lỗi: `application/problem+json` theo RFC 9457 với `code` ổn định. Hai dạng cùng schema `Problem`: dạng checkout/đơn
      (`type` = `https://x-shop.vn/problems/<code>`, có `detail`, `field?`, `action?`) và dạng chung (`type: about:blank`,
      có `errors[{param, reason}]`). `detail`/`title` tiếng Việt.
    - Route riêng tư trả `Cache-Control: private, no-store`; catalog công khai `public, s-maxage=60, stale-while-revalidate=300`.
    - Idempotency: header `Idempotency-Key` (16–128 ký tự `[A-Za-z0-9_-]`) ở các POST có thể bị gửi lại; hợp đồng mã lỗi hiện
      tại (422 thiếu/sai khóa, 409 `IDEMPOTENCY_CONFLICT` khi khác nội dung) là ngoại lệ có chủ đích so với mẫu 400/422 của khung.
  license:
    name: Chưa chọn (chờ chủ dự án)
    identifier: NOASSERTION
servers:
  - url: /
    description: "Cùng origin với backend Medusa (storefront gọi server-to-server; Admin cùng host backend)."
tags:
  - name: Catalog
    description: "Danh mục, tìm kiếm, chi tiết sản phẩm, địa chỉ (công khai, cache được)."
  - name: Checkout
    description: "Báo giá, đặt hàng idempotent, trạng thái lần đặt."
  - name: Orders
    description: "Đơn sau mua của khách (token phiên đơn), hủy, kiểm tra lại thanh toán, đổi trả."
  - name: Admin catalog
    description: "Bảng size, thuộc tính thời trang, nhập/xuất CSV."
  - name: Admin orders
    description: "Xác nhận COD, vận đơn, hủy đơn, điều chỉnh tồn."
  - name: Admin returns and refunds
    description: "Đổi trả theo dòng và hoàn tiền hai người."
  - name: Admin settlement
    description: "Đối soát COD/sao kê, báo cáo, ngoại lệ."
  - name: Admin security
    description: "Vai trò, audit."
  - name: Webhooks
    description: "VNPAY IPN và callback GHN (không đăng nhập)."
  - name: Ops
    description: "Kiểm sống."
security:
  - publishableKey: []
paths:
  # ---------------------------------------------------------------- store: catalog
  /store/x/products:
    get:
      tags: [Catalog]
      operationId: storeListProducts
      summary: "Danh sách sản phẩm có lọc và phân trang"
      description: "Tham số theo allowlist; sai hoặc `price_min > price_max` → 422 `INVALID_QUERY`. Kênh bán lấy từ publishable key."
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: color, in: query, schema: { type: string } }
        - { name: size, in: query, schema: { type: string } }
        - { name: material, in: query, schema: { type: string } }
        - { name: price_min, in: query, schema: { type: integer, minimum: 0 } }
        - { name: price_max, in: query, schema: { type: integer, minimum: 0 } }
        - { name: in_stock, in: query, schema: { type: string, enum: ["1"] } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc] } }
        - { name: category, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 9999 } }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, default: 24 }
          description: "Lớn hơn 48 bị kẹp về 48 (kể cả 10⁶); ≤ 0 hoặc không phải số nguyên → 422."
      responses:
        "200": { $ref: "#/components/responses/ProductListing" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /store/x/products/{handle}:
    get:
      tags: [Catalog]
      operationId: storeGetProduct
      summary: "Chi tiết sản phẩm cho trang chi tiết"
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: "Sản phẩm (biến thể, giá, tồn, ảnh theo màu, bảng size, thuộc tính)."
          headers: { Cache-Control: { $ref: "#/components/headers/CachePublicCatalog" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /store/x/search:
    get:
      tags: [Catalog]
      operationId: storeSearch
      summary: "Tìm kiếm (tên, SKU, danh mục; có/không dấu)"
      description: "Cùng tham số với danh sách; `q` dài hơn 100 ký tự bị cắt. Không có kết quả → gợi ý danh mục."
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 9999 } }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, default: 24 }
          description: "Lớn hơn 48 bị kẹp về 48 (kể cả 10⁶); ≤ 0 hoặc không phải số nguyên → 422."
      responses:
        "200":
          description: "Kết quả như danh sách, thêm `query` và `suggestions`."
          headers: { Cache-Control: { $ref: "#/components/headers/CachePublicCatalog" } }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ProductListing" }
                  - type: object
                    properties:
                      query: { type: [string, "null"] }
                      suggestions:
                        type: object
                        properties:
                          categories:
                            type: array
                            items:
                              type: object
                              required: [handle, name]
                              properties:
                                handle: { type: string }
                                name: { type: string }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /store/x/categories:
    get:
      tags: [Catalog]
      operationId: storeListCategories
      summary: "Danh mục đang có sản phẩm published trong kênh của publishable key"
      description: "Phân trang `limit`/`offset`; `limit` lớn hơn 200 bị kẹp về 200 (quy ước Store như `page_size`); `limit` ≤ 0, `offset` âm hoặc không phải số nguyên → 422 `INVALID_QUERY`."
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 200 }
          description: "Số danh mục mỗi trang; lớn hơn 200 bị kẹp về 200."
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000, default: 0 } }
      responses:
        "200":
          description: "Danh mục kèm số sản phẩm (đếm cả danh mục con), xếp theo rank rồi tên."
          headers: { Cache-Control: { $ref: "#/components/headers/CachePublicCatalog" } }
          content:
            application/json:
              schema:
                type: object
                required: [categories, count, limit, offset]
                properties:
                  count: { type: integer, minimum: 0, description: "Tổng số danh mục có hàng (mọi trang)." }
                  limit: { type: integer, minimum: 1, maximum: 200 }
                  offset: { type: integer, minimum: 0 }
                  categories:
                    type: array
                    items:
                      type: object
                      required: [handle, name, parent_handle, product_count]
                      properties:
                        handle: { type: string }
                        name: { type: string }
                        parent_handle: { type: [string, "null"] }
                        product_count: { type: integer, minimum: 1 }
        "422": { $ref: "#/components/responses/Validation" }
  /store/x/addresses/provinces:
    get:
      tags: [Catalog]
      operationId: storeListProvinces
      summary: "Tỉnh/thành phố (danh mục hai cấp)"
      responses:
        "200":
          description: "Danh mục tĩnh theo bản phát hành, cache dài."
          headers: { Cache-Control: { $ref: "#/components/headers/CacheAddress" } }
          content:
            application/json:
              schema:
                type: object
                required: [provinces]
                properties:
                  provinces:
                    type: array
                    items: { $ref: "#/components/schemas/GeoUnit" }
  /store/x/addresses/provinces/{code}/wards:
    get:
      tags: [Catalog]
      operationId: storeListWards
      summary: "Phường/xã của một tỉnh/thành"
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: "^[0-9]{1,10}$" } }
      responses:
        "200":
          description: "Danh sách phường/xã."
          headers: { Cache-Control: { $ref: "#/components/headers/CacheAddress" } }
          content:
            application/json:
              schema:
                type: object
                required: [province_code, wards]
                properties:
                  province_code: { type: string }
                  wards:
                    type: array
                    items: { $ref: "#/components/schemas/GeoUnit" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ---------------------------------------------------------------- store: checkout
  /store/x/checkout/quote:
    post:
      tags: [Checkout]
      operationId: storeCheckoutQuote
      summary: "Báo giá do server tính (không nhận giá/tổng từ client)"
      description: "Quote hết hạn sau 10 phút; kèm `cart_version`. Quyền với giỏ kiểm ở server (khách đăng nhập hoặc vãng lai sở hữu giỏ)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteRequest" }
      responses:
        "200":
          description: "Báo giá."
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                required: [quote]
                properties:
                  quote: { $ref: "#/components/schemas/Quote" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /store/x/checkout/submit:
    post:
      tags: [Checkout]
      operationId: storeCheckoutSubmit
      summary: "Đặt hàng idempotent (giữ hàng dưới khóa)"
      description: |
        200 = đơn đã tạo (COD `placed`; VNPAY `awaiting_payment` kèm `payment_url`) và token phiên đơn;
        202 = đang xử lý (poll `status_url`). Lỗi nghiệp vụ → problem+json (`PRICE_CHANGED` kèm `quote`, `INSUFFICIENT_STOCK`
        kèm `lines`, `BUSY_RETRY`, `LOCK_UNAVAILABLE` 503 kèm `Retry-After: 60`…).
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitRequest" }
      responses:
        "200":
          description: "Đơn đã tạo."
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitResult" }
        "202":
          description: "Đang xử lý."
          headers:
            Location: { schema: { type: string }, description: status_url }
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /store/x/checkout/attempts/{id}:
    get:
      tags: [Checkout]
      operationId: storeGetCheckoutAttempt
      summary: "Trạng thái một lần submit (phục hồi sau timeout)"
      description: "Chỉ phiên sở hữu giỏ của attempt xem được; thiếu/sai `cart_id` hoặc giỏ người khác → 404."
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { name: cart_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: "Trạng thái attempt (kèm `order_access` khi `state=ready`)."
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptView" }
        "404": { $ref: "#/components/responses/NotFound" }
  /store/x/checkout/attempts/{id}/recheck:
    post:
      tags: [Checkout]
      operationId: storeRecheckCheckoutAttempt
      summary: "Kiểm tra lại thanh toán sau khi quay về từ VNPAY"
      description: |
        Server hỏi cổng (querydr) và xử lý như IPN; KHÔNG đổi trạng thái theo tham số trình duyệt. Tối đa 1 lần/10 giây mỗi
        attempt (429 `RATE_LIMITED`); Redis lỗi → 503 `LOCK_UNAVAILABLE`.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { name: cart_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: "Attempt kèm `payment_check`."
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/AttemptView" }
                  - type: object
                    properties:
                      payment_check: { $ref: "#/components/schemas/PaymentCheck" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  # ---------------------------------------------------------------- store: orders
  /store/x/orders/lookup:
    post:
      tags: [Orders]
      operationId: storeOrderLookup
      summary: "Yêu cầu liên kết xem đơn (mã đơn + SĐT)"
      description: |
        Luôn 202 cùng thông điệp dù khớp hay không (chống dò tồn tại); khớp → liên kết một lần 15 phút gửi qua SĐT/email đã dùng.
        Định dạng sai → 422. Giới hạn 5/giờ/SĐT, 10/giờ/mã đơn, 20/giờ/IP → 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_ref, phone]
              properties:
                display_ref: { type: string, maxLength: 32 }
                phone: { type: string, maxLength: 32 }
      responses:
        "202":
          description: "Đã tiếp nhận."
          headers: { Cache-Control: { $ref: "#/components/headers/PrivateNoStore" } }
          content:
            application/json:
              schema:
                type: object
                required: [accepted, message]
                properties:
                  accepted: { type: boolean, const: true }
                  message: { type: string }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /store/x/orders/session:
    post:
      tags: [Orders]
      operationId: storeOrderSession
      summary: "Đổi liên kết tra cứu thành phiên đơn"
      description: "Token hết hạn/giả/đã dùng → 404 như nhau; hai request đồng thời chỉ một bên thắng."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, maxLength: 512 }
      responses:
        "200":
          description: "Phiên đơn."
          headers: { Cache-Control: { $ref: "#/components/headers/PrivateNoStore" } }
          content:
            application/json:
              schema:
                type: object
                required: [display_ref, order_access, order_access_expires_at]
                properties:
                  display_ref: { type: string }
                  order_access: { type: string, description: Token phiên đơn; storefront giữ trong cookie HttpOnly, không đưa lên URL. }
                  order_access_expires_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /store/x/orders/{display_ref}:
    get:
      tags: [Orders]
      operationId: storeGetOrder
      summary: "Xem đơn (header x-order-access)"
      description: "Token thiếu/sai/hết hạn hoặc của đơn khác → 404 như không tồn tại. Không trả email/id nội bộ; SĐT đã che."
      security:
        - publishableKey: []
          orderAccess: []
      parameters:
        - { $ref: "#/components/parameters/DisplayRef" }
      responses:
        "200":
          description: "Đơn với trạng thái tách riêng (state / payment_state / shipment_state) và timeline."
          headers: { Cache-Control: { $ref: "#/components/headers/PrivateNoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /store/x/orders/{display_ref}/cancel:
    post:
      tags: [Orders]
      operationId: storeCancelOrder
      summary: "Khách hủy đơn (idempotent)"
      description: "Đơn đã thu tiền → mở yêu cầu hoàn (`cancel.refund_requested`). 409 `NOT_CANCELLABLE` / `PAYMENT_PENDING`."
      security:
        - publishableKey: []
          orderAccess: []
      parameters:
        - { $ref: "#/components/parameters/DisplayRef" }
      responses:
        "200":
          description: "Đơn sau hủy kèm `cancel`."
          headers: { Cache-Control: { $ref: "#/components/headers/PrivateNoStore" } }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/OrderView" }
                  - type: object
                    properties:
                      cancel:
                        type: object
                        properties:
                          outcome: { type: string, enum: [cancelled, already_cancelled] }
                          refund_requested: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /store/x/orders/{display_ref}/recheck:
    post:
      tags: [Orders]
      operationId: storeRecheckOrder
      summary: "Kiểm tra lại thanh toán của đơn (querydr cùng giao dịch)"
      description: "Dùng chung khóa tần suất với recheck attempt (1 lần/10 giây mỗi lần đặt)."
      security:
        - publishableKey: []
          orderAccess: []
      parameters:
        - { $ref: "#/components/parameters/DisplayRef" }
      responses:
        "200":
          description: "Đơn kèm `payment_check`."
          headers: { Cache-Control: { $ref: "#/components/headers/PrivateNoStore" } }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/OrderView" }
                  - type: object
                    properties:
                      payment_check: { $ref: "#/components/schemas/PaymentCheck" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /store/x/orders/{display_ref}/returns:
    get:
      tags: [Orders]
      operationId: storeListOrderReturns
      summary: "Dòng còn đổi/trả được và các yêu cầu của chính khách"
      security:
        - publishableKey: []
          orderAccess: []
      parameters:
        - { $ref: "#/components/parameters/DisplayRef" }
      responses:
        "200":
          description: "Danh sách. Hàng hoàn từ hãng (nội bộ kho) không hiện."
          headers: { Cache-Control: { $ref: "#/components/headers/PrivateNoStore" } }
          content:
            application/json:
              schema:
                type: object
                required: [display_ref, can_request, lines, returns]
                properties:
                  display_ref: { type: string }
                  can_request: { type: boolean }
                  lines: { type: array, items: { type: object, additionalProperties: true } }
                  returns: { type: array, items: { $ref: "#/components/schemas/ReturnView" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Orders]
      operationId: storeCreateOrderReturn
      summary: "Khách tạo yêu cầu đổi/trả theo dòng"
      description: "Gửi lại cùng `Idempotency-Key` → 200 yêu cầu cũ (`Idempotent-Replayed: true`)."
      security:
        - publishableKey: []
          orderAccess: []
      parameters:
        - { $ref: "#/components/parameters/DisplayRef" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnRequest" }
      responses:
        "200": { $ref: "#/components/responses/ReturnReplayed" }
        "201": { $ref: "#/components/responses/ReturnCreated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  # ---------------------------------------------------------------- admin: catalog
  /admin/x/size-charts:
    get:
      tags: [Admin catalog]
      operationId: adminListSizeCharts
