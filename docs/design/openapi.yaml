  /admin/x/orders/{id}/cancel-unverified:
    post:
      tags: [Admin orders]
      operationId: adminCancelUnverifiedOrder
      summary: "Hủy đơn có thanh toán chưa xác minh sau khi đối chiếu tay với cổng merchant (chỉ owner)"
      description: >-
        T-165, D-118. Quyền `payment.override` (chỉ owner, MFA) + xác thực lại ≤ 5 phút (D-122; quá hạn → 403 `REAUTH_REQUIRED`). Chỉ đơn `awaiting_payment` có attempt `unknown` hoặc
        `created|pending` đã quá `hold_expires_at`, chưa ghi nhận tiền. Dưới khóa đơn (cùng IPN/job): hỏi cổng lần cuối
        (đã trả → đơn được xác nhận, trả 409 `NOT_AWAITING_PAYMENT`), rồi hủy + nhả hàng + đóng `payment_unknown` + audit
        `order.cancelled_unverified`. Tiền đến sau → `late_payment` → hoàn (AT09). Gửi lại cùng khóa + nội dung → kết quả cũ
        (`Idempotent-Replayed`); khác nội dung → 409 `IDEMPOTENCY_CONFLICT`; khóa khác trên đơn đã hủy → 409
        `NOT_AWAITING_PAYMENT` (`state`); thanh toán không ở diện chưa xác minh → 409 `PAYMENT_NOT_UNVERIFIED` (`reason`:
        `hold_active` | `no_open_payment` | `payment_received`).
      security:
        - adminSession: []
        - adminBearer: []
      x-permission: payment.override
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelUnverifiedRequest" }
      responses:
        "200":
          description: "Đã hủy (hoặc kết quả cũ của cùng khóa)."
          content:
            application/json:
              schema:
                type: object
                required: [order_id, state, cancel]
                properties:
                  order_id: { type: string }
                  state: { type: [string, "null"] }
                  cancel:
                    type: object
                    required: [outcome, from]
                    properties:
                      outcome: { type: string, enum: [cancelled] }
                      from: { type: string, enum: [awaiting_payment] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
