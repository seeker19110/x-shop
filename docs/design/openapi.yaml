      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleRequest" }
      responses:
        "200": { $ref: "#/components/responses/UserRoles" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  # ---------------------------------------------------------------- webhooks and ops
  /x/webhooks/vnpay/ipn:
    get:
      tags: [Webhooks]
      operationId: vnpayIpn
      summary: "VNPAY gọi báo kết quả thanh toán (IPN)"
      description: |
        Chỉ VNPAY gọi; không cần publishable key hay đăng nhập — tin cậy duy nhất là chữ ký HMAC-SHA512 (`vnp_SecureHash`) cùng
        so khớp tmn/mã giao dịch/số tiền. Luôn trả HTTP 200 với `RspCode` theo protocol (lỗi nội bộ → `99` để VNPAY gửi lại);
        quá 300 request/10 giây/IP → 429 với body `RspCode 99`. Idempotent: IPN lặp không ghi thu hai lần.
      security: []
      parameters:
        - name: vnp_SecureHash
          in: query
          required: true
          schema: { type: string }
          description: "Chữ ký HMAC-SHA512 trên các tham số `vnp_*` đã sắp xếp."
        - name: vnp_TxnRef
          in: query
          required: true
          schema: { type: string }
        - name: vnp_Amount
          in: query
          required: true
          schema: { type: string }
          description: "Số tiền nhân 100 theo protocol VNPAY."
        - name: vnp_ResponseCode
          in: query
          schema: { type: string }
        - name: vnp_TransactionStatus
          in: query
          schema: { type: string }
        - name: vnp_TransactionNo
          in: query
          schema: { type: string }
        - name: vnp_TmnCode
          in: query
          schema: { type: string }
      responses:
        "200":
          description: "Kết quả xử lý theo protocol VNPAY."
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpnResponse" }
        "429":
          description: "Vượt giới hạn tần suất (body như `RspCode 99`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpnResponse" }
  /x/webhooks/shipping/ghn:
    post:
      tags: [Webhooks]
      operationId: ghnCallback
      summary: "GHN gọi khi vận đơn đổi trạng thái hoặc COD"
      description: |
        Không có chữ ký đáng tin (chưa xác minh tài liệu GHN) nên KHÔNG tin nội dung: lưu sự kiện đã lọc PII rồi tra lại vận đơn
        qua API có token trước khi đổi trạng thái. 503 = chưa xử lý xong, hãng gửi lại. Quá 300 request/10 giây/IP → 429.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: "Đã tiếp nhận (hoặc bỏ qua có chủ đích)."
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallbackAck" }
        "400":
          description: "Thân không hợp lệ (`INVALID_CALLBACK`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallbackAck" }
        "429":
          description: "Vượt giới hạn tần suất."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallbackAck" }
        "503":
          description: "Chưa xử lý xong (`BUSY_RETRY`, `PROVIDER_UNAVAILABLE`, `INTERNAL`), hãng gửi lại."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallbackAck" }
  /x/health:
    get:
      tags: [Ops]
      operationId: health
      summary: "Kiểm sống tối giản (không chạm DB, không lộ phiên bản)"
      security: []
      responses:
        "200":
          description: "Còn sống."
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /x/readyz:
    get:
      tags: [Ops]
      operationId: readiness
      summary: "Sẵn sàng phục vụ: Postgres + Redis trả lời trong 1 s (không lộ phụ thuộc nào hỏng, không phiên bản)"
      security: []
      responses:
        "200":
          description: "Sẵn sàng."
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ready }
        "503":
          description: "Chưa sẵn sàng (`NOT_READY`) — chi tiết chỉ ở log server."
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  securitySchemes:
    publishableKey:
      type: apiKey
      in: header
      name: x-publishable-api-key
      description: "Khóa publishable của Medusa (xác định kênh bán). Bắt buộc cho `/store/*`; khóa công khai, không phải bí mật."
    orderAccess:
      type: apiKey
      in: header
      name: x-order-access
      description: |
        Token phiên đơn HMAC (7 ngày, dùng lại được) lấy từ submit/attempt/session. Storefront giữ trong cookie HttpOnly và
        gửi qua header ở server; không bao giờ đặt trên URL. Thiếu/sai/hết hạn/của đơn khác → 404.
    adminSession:
      type: apiKey
      in: cookie
      name: connect.sid
      description: "Phiên admin của Medusa (HttpOnly; production Secure + SameSite=Lax). Ghi (POST/PUT/PATCH/DELETE) kèm cookie phải qua kiểm Origin (CSRF) — `CSRF_REJECTED` 403."
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT admin của Medusa (thay cho cookie ở client không phải trình duyệt)."
  headers:
    NoStore:
      description: "Không cache."
      schema: { type: string, const: no-store }
    PrivateNoStore:
      description: "Phản hồi riêng tư, không cache dùng chung."
      schema: { type: string, const: "private, no-store" }
    CachePublicCatalog:
      description: "Cache công khai ngắn cho catalog."
      schema: { type: string, const: "public, s-maxage=60, stale-while-revalidate=300" }
    CacheAddress:
      description: "Danh mục địa chỉ tĩnh, cache dài."
      schema: { type: string, const: "public, max-age=3600, s-maxage=86400, stale-while-revalidate=604800" }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$" }
      description: "Thiếu/sai → 422 `VALIDATION`. Cùng khóa + cùng nội dung → trả kết quả cũ; khác nội dung → 409 `IDEMPOTENCY_CONFLICT`."
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    DisplayRef:
      name: display_ref
      in: path
      required: true
      schema: { type: string, maxLength: 32 }
      description: "Mã đơn hiển thị cho khách."
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      description: "Vượt khoảng → 422 (không kẹp ngầm)."
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
  responses:
    ProblemGeneric:
      description: "Lỗi theo RFC 9457."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: "Chưa đăng nhập hoặc phiên hết hạn/nhàn rỗi (`UNAUTHORIZED`, `SESSION_EXPIRED`, `SESSION_IDLE`)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: "Thiếu quyền (`FORBIDDEN`, `SELF_APPROVAL`), cần MFA (`MFA_REQUIRED`) hoặc xác thực lại (`REAUTH_REQUIRED`), hoặc `CSRF_REJECTED`."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: "Không tồn tại — hoặc không có quyền với đối tượng (không phân biệt) — `NOT_FOUND`."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: "Xung đột trạng thái/idempotency/khóa (`INSUFFICIENT_STOCK`, `IDEMPOTENCY_CONFLICT`, `BUSY_RETRY`, `INVALID_STATE`, `IMPORT_IN_PROGRESS`…)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Validation:
      description: "Dữ liệu không hợp lệ (`VALIDATION`, `INVALID_QUERY`, `IMPORT_HAS_ERRORS`…); `field` hoặc `errors[]` chỉ trường lỗi."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: "Vượt giới hạn tần suất (`RATE_LIMITED`); header `Retry-After`."
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unavailable:
      description: "Hạ tầng khóa không dùng được (`LOCK_UNAVAILABLE`, kèm `Retry-After: 60`) hoặc dịch vụ ngoài tạm lỗi (`SHIPPING_UNAVAILABLE`). Không tạo đơn/giữ hàng."
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ProductListing:
      description: "Danh sách sản phẩm, facet và tổng số."
      headers: { Cache-Control: { $ref: "#/components/headers/CachePublicCatalog" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProductListing" }
    ReturnCreated:
      description: "Đã tạo yêu cầu đổi/trả."
      headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReturnEnvelope" }
    ReturnReplayed:
      description: "Gửi lại cùng `Idempotency-Key` → yêu cầu cũ."
      headers:
        Idempotent-Replayed: { schema: { type: string, enum: ["true"] } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReturnEnvelope" }
    ReturnChanged:
      description: "Kết quả quyết định; `changed: false` khi gọi lại."
      content:
        application/json:
          schema:
            type: object
            properties:
              changed: { type: boolean }
              return: { $ref: "#/components/schemas/ReturnView" }
    RefundCreated:
      description: "Đã tạo yêu cầu hoàn."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RefundEnvelope" }
    RefundReplayed:
      description: "Gửi lại cùng khóa → bản cũ."
      headers:
        Idempotent-Replayed: { schema: { type: string, enum: ["true"] } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RefundEnvelope" }
    RefundChanged:
      description: "Kết quả; `changed: false` khi gọi lại."
      content:
        application/json:
          schema:
            type: object
            properties:
              changed: { type: boolean }
              refund: { $ref: "#/components/schemas/Refund" }
    RefundOutcome:
      description: "Kết quả thực hiện hoàn (`succeeded`, `already_succeeded`, `unknown`, `failed`)."
      content:
        application/json:
          schema:
            type: object
            properties:
              outcome: { type: string, enum: [succeeded, already_succeeded, unknown, failed] }
              refund: { $ref: "#/components/schemas/Refund" }
    Shipment:
      description: "Kết quả tạo vận đơn."
      content:
        application/json:
          schema:
            type: object
            properties:
              outcome: { type: string, enum: [created, existing, pending] }
              shipment: { type: object, additionalProperties: true }
    AdjustmentCreated:
      description: "Đã điều chỉnh tồn."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdjustmentEnvelope" }
    AdjustmentReplayed:
      description: "Gửi lại cùng khóa → kết quả cũ."
      headers:
        Idempotent-Replayed: { schema: { type: string, enum: ["true"] } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdjustmentEnvelope" }
    UserRoles:
      description: "Vai trò hiện tại của người dùng."
      content:
        application/json:
          schema:
            type: object
            properties:
              user_id: { type: string }
              roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
              changed: { type: boolean }
  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 problem details. `code` ổn định để client xử lý; `detail`/`title` tiếng Việt. Khóa riêng theo `code`
        (vd `quote`, `lines`, `current_cart_version`, `retry_after_seconds`, `permission`, `import_id`) nằm cùng cấp.
      required: [type, title, status, code, trace_id]
      properties:
        type: { type: string, description: "`https://x-shop.vn/problems/<code>` (checkout/đơn) hoặc `about:blank` (dạng chung)." }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string, description: "Mã ổn định, vd `VALIDATION`, `NOT_FOUND`, `INSUFFICIENT_STOCK`." }
        detail: { type: string }
        field: { type: string, description: "Trường gây lỗi, vd `contact.phone`." }
        action: { type: string, description: "Gợi ý cho client, vd `requote`, `retry_same_key`." }
        trace_id:
          type: string
          description: "Mã tham chiếu request (header `x-request-id` hợp lệ hoặc UUID) — cùng mã trong log server, để tra lỗi (T-088)."
        message:
          type: string
          description: "Chỉ ở lỗi đi qua handler toàn cục (route ném lỗi, route native): bằng `detail`, giữ cho client Medusa (js-sdk đọc `message`)."
        errors:
          type: array
          items:
            type: object
            required: [param, reason]
            properties:
              param: { type: string }
              reason: { type: string }
      additionalProperties: true
    GeoUnit:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    ProductListing:
      type: object
      required: [items, facets, total, page, page_size]
      properties:
        items:
          type: array
          items:
            type: object
            required: [product_id, handle, title, price_min, price_max, in_stock]
            properties:
              product_id: { type: string }
              handle: { type: string }
              title: { type: string }
              price_min: { type: integer }
              price_max: { type: integer }
              compare_at: { type: [integer, "null"] }
              colors: { type: array, items: { $ref: "#/components/schemas/ColorSwatch" } }
              thumbnail: { type: [string, "null"] }
              in_stock: { type: boolean }
        facets:
          type: object
          properties:
            color: { type: array, items: { $ref: "#/components/schemas/Facet" } }
            size: { type: array, items: { $ref: "#/components/schemas/Facet" } }
            material: { type: array, items: { $ref: "#/components/schemas/Facet" } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 48 }
        filter: { type: string }
        category: { type: [string, "null"] }
    ColorSwatch:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }
        hex: { type: [string, "null"] }
    Facet:
      type: object
      required: [value, label, count]
      properties:
        value: { type: string }
        label: { type: string }
        count: { type: integer, minimum: 0 }
        hex: { type: [string, "null"] }
    ProductDetail:
      type: object
      required: [product_id, handle, title, variants]
      properties:
        product_id: { type: string }
        handle: { type: string }
        title: { type: string }
        description: { type: [string, "null"] }
        kind: { type: string }
        attributes: { type: object, additionalProperties: true }
        category:
          type: [object, "null"]
          properties:
            handle: { type: string }
            name: { type: string }
        options:
          type: object
          properties:
            colors: { type: array, items: { $ref: "#/components/schemas/ColorSwatch" } }
            sizes: { type: array, items: { type: object, additionalProperties: true } }
        variants:
          type: array
          items:
            type: object
            required: [variant_id, sku, price, in_stock]
            properties:
              variant_id: { type: string }
              sku: { type: string }
              color: { type: [string, "null"] }
              size: { type: [string, "null"] }
              price: { type: integer }
              compare_at: { type: [integer, "null"] }
              in_stock: { type: boolean }
        images: { type: array, items: { type: object, additionalProperties: true } }
        size_chart: { type: [object, "null"], additionalProperties: true }
        model_measurements: { type: array, items: { type: object, additionalProperties: true } }
        updated_at: { type: string, format: date-time }
    AddressInput:
      type: object
      additionalProperties: false
      required: [province_code, ward_code, line]
      properties:
        province_code: { type: string, minLength: 1, maxLength: 10 }
        ward_code: { type: string, minLength: 1, maxLength: 10 }
        line: { type: string, maxLength: 500, description: "Số nhà, tên đường." }
    PaymentMethod:
      type: string
      enum: [cod, vnpay]
    QuoteRequest:
      type: object
      additionalProperties: false
      required: [cart_id, payment_method, address]
      properties:
        cart_id: { type: string, minLength: 1, maxLength: 100 }
        payment_method: { $ref: "#/components/schemas/PaymentMethod" }
        address: { $ref: "#/components/schemas/AddressInput" }
        discount_code: { type: [string, "null"], maxLength: 64 }
    Quote:
      type: object
      required: [id, cart_id, cart_version, payment_method, expires_at, currency_code, lines, subtotal, total]
      properties:
        id: { type: string }
        cart_id: { type: string }
        cart_version: { type: integer }
        payment_method: { $ref: "#/components/schemas/PaymentMethod" }
        discount_code: { type: [string, "null"] }
        expires_at: { type: string, format: date-time }
        currency_code: { type: string }
        lines:
          type: array
          items:
            type: object
            properties:
              line_item_id: { type: string }
              variant_id: { type: string }
              unit_price: { type: integer }
              quantity: { type: integer }
              subtotal: { type: integer }
              discount: { type: integer }
              total: { type: integer }
        subtotal: { type: integer }
        discount_total: { type: integer }
        shipping_fee: { type: integer }
        shipping_discount: { type: integer }
        shipping_total: { type: integer }
        total: { type: integer }
        address: { type: object, additionalProperties: true }
    SubmitRequest:
      type: object
      additionalProperties: false
      required: [cart_id, cart_version, quote_id, payment_method, contact, address]
      properties:
        cart_id: { type: string, minLength: 1, maxLength: 100 }
        cart_version: { type: integer, minimum: 1, maximum: 1000000 }
        quote_id: { type: string, minLength: 1, maxLength: 100 }
        payment_method: { $ref: "#/components/schemas/PaymentMethod" }
        contact:
          type: object
          additionalProperties: false
          required: [name, phone]
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
            phone: { type: string, maxLength: 32 }
            email: { type: [string, "null"], maxLength: 254 }
        address: { $ref: "#/components/schemas/AddressInput" }
    AttemptView:
      type: object
      required: [checkout_attempt_id, state]
      properties:
        checkout_attempt_id: { type: string }
        state: { type: string, enum: [preparing, ready, failed, compensated] }
        cart_id: { type: string }
        cart_version: { type: integer }
        payment_method: { $ref: "#/components/schemas/PaymentMethod" }
        order:
          type: [object, "null"]
          properties:
            id: { type: string }
            display_ref: { type: string }
            state: { type: string, enum: [placed, awaiting_payment] }
            total: { type: integer }
            payment_method: { $ref: "#/components/schemas/PaymentMethod" }
            hold_expires_at: { type: [string, "null"], format: date-time }
            cod_confirm_by: { type: [string, "null"], format: date-time }
        payment_url: { type: [string, "null"] }
        error:
          type: [object, "null"]
          properties:
            code: { type: string }
            message: { type: string }
        status_url: { type: string }
        order_access: { type: string, description: "Có khi `state=ready`." }
        order_access_expires_at: { type: string, format: date-time }
    SubmitResult:
      allOf:
        - { $ref: "#/components/schemas/AttemptView" }
        - type: object
          required: [status_url]
    PaymentCheck:
      type: string
      enum: [paid, not_paid, failed, unknown, skipped]
    OrderView:
      type: object
      required: [display_ref, state, payment_method, payment_state, shipment_state, totals, lines, actions]
      properties:
        display_ref: { type: string }
        state: { type: string }
        payment_method: { $ref: "#/components/schemas/PaymentMethod" }
        payment_state: { type: string, enum: [cod, pending, unknown, paid, refund_pending, expired, void] }
        shipment_state: { type: string, enum: [unfulfilled, picking, packed, shipped, delivered] }
        created_at: { type: string, format: date-time }
        hold_expires_at: { type: [string, "null"], format: date-time }
        cod_confirm_by: { type: [string, "null"], format: date-time }
        cancel_reason: { type: [string, "null"] }
        timeline:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              kind: { type: string }
              label: { type: string }
        lines:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              variant_title: { type: [string, "null"] }
              quantity: { type: integer }
              unit_price: { type: integer }
              total: { type: integer }
              thumbnail: { type: [string, "null"] }
        totals:
          type: object
          properties:
            subtotal: { type: integer }
            discount_total: { type: integer }
            shipping_total: { type: integer }
            total: { type: integer }
            paid: { type: integer }
        address:
          type: object
          properties:
            province_name: { type: string }
            ward_name: { type: string }
            line: { type: string }
        contact:
          type: object
          properties:
            name: { type: string }
            phone: { type: string, description: "Đã che, vd `0912***678`." }
        actions:
          type: object
          properties:
            can_cancel: { type: boolean }
            can_recheck: { type: boolean }
    ReturnState:
      type: string
      enum: [requested, approved, rejected, received, inspected, closed]
    RefundState:
      type: string
      enum: [requested, approved, rejected, processing, succeeded, failed, unknown, cancelled]
    SettlementSource:
      type: string
      enum: [ghn_cod, vnpay]
    Role:
      type: string
      enum: [owner, catalog_manager, order_staff, warehouse, support, accountant]
    ReturnRequest:
      type: object
      additionalProperties: false
      required: [kind, reason, lines]
      properties:
        kind: { type: string, enum: [return, exchange] }
        reason: { type: string, enum: [wrong_size, defective, not_as_described, changed_mind, other] }
        note: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [line_id, quantity]
            properties:
              line_id: { type: string, minLength: 1, maxLength: 128 }
              quantity: { type: integer, minimum: 1, maximum: 99 }
              exchange_variant_id: { type: string, minLength: 1, maxLength: 128 }
    ReturnView:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        state: { $ref: "#/components/schemas/ReturnState" }
        kind: { type: string, enum: [return, exchange] }
        reason: { type: string }
        lines: { type: array, items: { type: object, additionalProperties: true } }
    ReturnEnvelope:
      type: object
      properties:
        return: { $ref: "#/components/schemas/ReturnView" }
    Refund:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        order_id: { type: string }
        state: { $ref: "#/components/schemas/RefundState" }
        amount: { type: integer }
        reason: { type: string }
    RefundEnvelope:
      type: object
      properties:
        refund: { $ref: "#/components/schemas/Refund" }
    RefundCreateRequest:
      type: object
      additionalProperties: false
      required: [order_id, reason]
      description: |
        `reason=return` bắt buộc `return_id` và cấm `amount` (lấy theo kiểm định). `reason` khác `cancellation` bắt buộc `amount`.
        `other`/`overpayment` bắt buộc `note`.
      properties:
        order_id: { type: string, minLength: 1, maxLength: 128 }
        reason: { type: string, enum: [return, cancellation, overpayment, late_payment, other] }
        return_id: { type: string, minLength: 1, maxLength: 128 }
        amount: { type: integer, exclusiveMinimum: 0, maximum: 2147483647 }
        method: { type: string, enum: [provider, manual, auto] }
        note: { type: string, maxLength: 500 }
    DecisionRequest:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 500 }
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    CancelUnverifiedRequest:
      type: object
      additionalProperties: false
      required: [reason, merchant_ref]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500, description: "Đã đối chiếu gì, ở đâu (khoảng trắng hai đầu bị cắt)." }
        merchant_ref:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{5,63}$"
          description: "Mã đối chiếu thấy trên cổng merchant VNPAY (6–64 ký tự ASCII, không khoảng trắng; định dạng chưa xác minh với tài liệu merchant)."
    Changed:
      type: object
      additionalProperties: true
      properties:
        changed: { type: boolean }
    AdjustmentRequest:
      type: object
      additionalProperties: false
      required: [inventory_item_id, location_id, delta, reason]
      properties:
        inventory_item_id: { type: string, minLength: 1, maxLength: 128 }
        location_id: { type: string, minLength: 1, maxLength: 128 }
        delta:
          type: integer
          minimum: -1000000
          maximum: 1000000
          not: { const: 0 }
        reason: { type: string, description: "Một khóa lý do điều chỉnh; hướng (tăng/giảm) kiểm cùng `delta`." }
        note: { type: string, maxLength: 500 }
    AdjustmentEnvelope:
      type: object
      properties:
        adjustment: { type: object, additionalProperties: true }
    SizeChartContent:
      type: object
      required: [name, garment_type, columns, rows]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        garment_type: { type: string, minLength: 1, maxLength: 60 }
        unit: { type: string, const: cm, default: cm }
        columns:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [key, label, basis]
            properties:
              key: { type: string, pattern: "^[a-z][a-z0-9_]{0,29}$" }
              label: { type: string, minLength: 1, maxLength: 60 }
              basis: { type: string, enum: [body, garment] }
        rows:
          type: array
          minItems: 1
          maxItems: 40
          items:
            type: object
            required: [size, label, values]
            properties:
              size: { type: string, minLength: 1, maxLength: 20 }
              label: { type: string, minLength: 1, maxLength: 20 }
              values:
                type: object
                description: "Mỗi ô là số cm (0–400) hoặc cặp [min, max] với min ≤ max."
                additionalProperties:
                  oneOf:
                    - { type: number, minimum: 0, maximum: 400 }
                    - type: array
                      minItems: 2
                      maxItems: 2
                      items: { type: number, minimum: 0, maximum: 400 }
    SizeChart:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        code: { type: string }
        version: { type: integer }
        name: { type: string }
    ProductFashionRequest:
      type: object
      required: [attributes]
      properties:
        attributes:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [apparel, shoes, accessory] }
            material: { type: [string, "null"], maxLength: 60 }
            material_label: { type: [string, "null"], maxLength: 60 }
            composition: { type: [string, "null"], maxLength: 255 }
            stretch: { type: [string, "null"], enum: [none, low, medium, high, null] }
            fit: { type: [string, "null"], maxLength: 60 }
            care: { type: [string, "null"], maxLength: 1000 }
            origin: { type: [string, "null"], maxLength: 60 }
            image_exception_by: { type: [string, "null"], maxLength: 120 }
            image_exception_reason: { type: [string, "null"], maxLength: 500 }
        size_chart_id: { type: [string, "null"], description: "Bỏ qua = giữ nguyên; null = gỡ bảng size." }
        model_measurements:
          type: array
          maxItems: 20
          description: "Bỏ qua = giữ nguyên; mảng = thay toàn bộ."
          items:
            type: object
            required: [image_set, height_cm, size_worn]
            properties:
              image_set: { type: string, minLength: 1, maxLength: 60 }
              color: { type: [string, "null"], maxLength: 40 }
              height_cm: { type: integer, minimum: 50, maximum: 250 }
              chest_cm: { type: [integer, "null"], minimum: 20, maximum: 250 }
              waist_cm: { type: [integer, "null"], minimum: 20, maximum: 250 }
              hip_cm: { type: [integer, "null"], minimum: 20, maximum: 250 }
              size_worn: { type: string, minLength: 1, maxLength: 20 }
              note: { type: [string, "null"], maxLength: 255 }
    ImportJob:
      type: object
      additionalProperties: true
      properties:
        import_id: { type: string }
        status: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              line: { type: integer }
              column: { type: string }
              message: { type: string }
        rows: { type: array, items: { type: object, additionalProperties: true } }
        can_commit: { type: boolean }
    Page:
      type: object
      additionalProperties: true
      properties:
        count: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    RoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        reason: { type: string, maxLength: 500 }
    IpnResponse:
      type: object
      required: [RspCode, Message]
      properties:
        RspCode: { type: string, description: "Mã theo protocol VNPAY: `00` xác nhận, `01` không thấy đơn, `02` đã xác nhận trước đó, `04` sai số tiền, `97` sai chữ ký, `99` lỗi khác (VNPAY gửi lại)" }
        Message: { type: string }
    CallbackAck:
      type: object
      additionalProperties: true
      properties:
        ok: { type: boolean }
        code: { type: string }
