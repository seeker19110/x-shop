                    required: [line_id, quantity]
                    properties:
                      line_id: { type: string, minLength: 1, maxLength: 128 }
                      quantity: { type: integer, minimum: 0, maximum: 99 }
      responses:
        "200": { $ref: "#/components/responses/ReturnChanged" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/x/returns/{id}/inspect:
    post:
      tags: [Admin returns and refunds]
      operationId: adminInspectReturn
      summary: "Kết quả kiểm định từng dòng (nhập lại tồn một lần)"
      description: "Trả hàng → mở yêu cầu hoàn theo giá thực trả; đổi size → xác nhận/hủy đơn thay thế."
      security:
        - adminSession: []
        - adminBearer: []
      x-permission: return.inspect
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [line_id, restock_quantity, damaged_quantity]
                    properties:
                      line_id: { type: string, minLength: 1, maxLength: 128 }
                      restock_quantity: { type: integer, minimum: 0, maximum: 99 }
                      damaged_quantity: { type: integer, minimum: 0, maximum: 99 }
                      note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: "Kết quả kiểm định."
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed: { type: boolean }
                  return: { $ref: "#/components/schemas/ReturnView" }
                  refund:
                    oneOf:
                      - { $ref: "#/components/schemas/Refund" }
                      - { type: "null" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  # ---------------------------------------------------------------- admin: refunds
  /admin/x/refunds:
    get:
      tags: [Admin returns and refunds]
      operationId: adminListRefunds
      summary: "Tóm tắt hoàn tiền của một đơn, hoặc hàng đợi theo trạng thái"
      description: |
        Có `order_id` (và không tham số khác) → tóm tắt đã thu/đã hoàn/đang giữ/còn hoàn được + danh sách yêu cầu.
        Không có `order_id` → `state` bắt buộc, hàng đợi cũ nhất trước.
      security:
        - adminSession: []
        - adminBearer: []
      x-permission: refund.request
      parameters:
        - { name: order_id, in: query, schema: { type: string, maxLength: 128 } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/RefundState" } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: "Tóm tắt hoặc hàng đợi."
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [Admin returns and refunds]
      operationId: adminCreateRefund
      summary: "Tạo yêu cầu hoàn tiền"
      description: |
        Σ hoàn ≤ Σ đã thu kể cả khoản đang giữ (422 `REFUND_EXCEEDS_CAPTURED`). Vượt ngưỡng 1.000.000 đ (hoặc hoàn toàn bộ khi hủy đơn)
        → xác thực lại MFA ≤ 5 phút (403 `REAUTH_REQUIRED`) và người thứ hai duyệt.
      security:
        - adminSession: []
        - adminBearer: []
      x-permission: refund.request
      x-reauth: conditional
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundCreateRequest" }
      responses:
        "200": { $ref: "#/components/responses/RefundReplayed" }
        "201": { $ref: "#/components/responses/RefundCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/x/refunds/{id}/approve:
    post:
      tags: [Admin returns and refunds]
      operationId: adminApproveRefund
      summary: "Người thứ hai duyệt hoàn tiền"
      description: "Khác người tạo (403 `SELF_APPROVAL`). Yêu cầu vượt ngưỡng → xác thực lại MFA ≤ 5 phút."
      security:
        - adminSession: []
        - adminBearer: []
      x-permission: refund.approve
      x-reauth: conditional
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionRequest" }
      responses:
        "200": { $ref: "#/components/responses/RefundChanged" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/x/refunds/{id}/reject:
    post:
      tags: [Admin returns and refunds]
      operationId: adminRejectRefund
      summary: "Từ chối yêu cầu hoàn chưa duyệt (nhả số đang giữ)"
      description: "Hoàn theo trả hàng (`reason = return` / có `return_id`) không từ chối được → 409 `RETURN_REFUND_NOT_REJECTABLE` kèm `refund_id`, `return_id`, `state`, `method`, `next_steps`, `evidence_required`. `next_steps` theo cách hoàn + trạng thái: provider `requested` → approve, execute, cancel, recreate; manual (gồm COD) `requested` → approve, execute (kèm `evidence_ref`); `failed` → execute (còn lượt), cancel, recreate; `processing`/`unknown` → execute; đã kết thúc → []. Bản đã `rejected` (dữ liệu trước T-173) → 200 trả nguyên (idempotent)."
      security:
        - adminSession: []
        - adminBearer: []
      x-permission: refund.approve
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200": { $ref: "#/components/responses/RefundChanged" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/x/refunds/{id}/execute:
    post:
      tags: [Admin returns and refunds]
      operationId: adminExecuteRefund
      summary: "Thực hiện hoàn đã duyệt"
      description: "Retry/timeout dùng CÙNG mã yêu cầu, hỏi lại cổng trước khi gửi lại. 200 succeeded · 202 unknown (`Retry-After: 30`) · 502 failed. Hoàn ngoài hệ thống cần `evidence_ref`."
      security:
        - adminSession: []
        - adminBearer: []
      x-permission: refund.execute
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                evidence_ref: { type: string, minLength: 3, maxLength: 128 }
      responses:
        "200": { $ref: "#/components/responses/RefundOutcome" }
        "202": { $ref: "#/components/responses/RefundOutcome" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
        "502": { $ref: "#/components/responses/RefundOutcome" }
  /admin/x/refunds/{id}/cancel:
    post:
      tags: [Admin returns and refunds]
      operationId: adminCancelRefund
      summary: "Hủy yêu cầu hoàn đã thất bại (nhả số đang giữ)"
      description: "409 `INVALID_STATE` khi không ở `failed` hoặc cổng báo đã hoàn; 409 `REFUND_PROVIDER_UNCONFIRMED`."
      security:
        - adminSession: []
        - adminBearer: []
      x-permission: refund.execute
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200": { $ref: "#/components/responses/RefundChanged" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  # ---------------------------------------------------------------- admin: settlement and reports
  /admin/x/settlements/batches:
    get:
      tags: [Admin settlement]
      operationId: adminListSettlementBatches
      summary: "Danh sách batch đối soát (mới nhất trước)"
      security:
        - adminSession: []
        - adminBearer: []
      x-permission: settlement.read
      parameters:
        - { name: source, in: query, schema: { $ref: "#/components/schemas/SettlementSource" } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: "Danh sách batch."
          content:
            application/json:
              schema:
                type: object
                properties:
                  batches: { type: array, items: { type: object, additionalProperties: true } }
                  count: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [Admin settlement]
      operationId: adminImportSettlementBatch
      summary: "Nhập chứng từ đối soát (CSV)"
      description: |
        Thân `text/csv` hoặc multipart trường `file`; một dòng sai → 422 cả file. Cùng chứng từ nhập lại → 200 +
        `Idempotent-Replayed: true`; mới → 201. Mã batch hãng trùng mà khác nội dung → 409 `BATCH_CONFLICT`. Lần nhập khác
        cùng nguồn giữ khoá quá 10 s → 409 `IMPORT_IN_PROGRESS` + `Retry-After: 10`, chưa ghi gì (T-140). Cần MFA.
      security:
        - adminSession: []
        - adminBearer: []
      x-permission: settlement.import
      parameters:
        - { name: source, in: query, required: true, schema: { $ref: "#/components/schemas/SettlementSource" } }
        - { name: external_ref, in: query, schema: { type: string } }
        - { name: period_end, in: query, schema: { type: string, format: date-time } }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: "Chứng từ đã có (replay)."
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ["true"] } }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "201":
          description: "Batch mới kèm dòng đã đối chiếu và chênh lệch mở ra."
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            `BATCH_CONFLICT` — mã batch hãng đã nhập với nội dung khác (không gọi lại). `IMPORT_IN_PROGRESS` — lần nhập khác
            cùng nguồn giữ khoá quá 10 s; chưa ghi gì, gọi lại sau `Retry-After` giây (T-140).
          headers:
            Retry-After:
              description: "Chỉ khi `IMPORT_IN_PROGRESS`: số giây nên chờ trước khi gọi lại."
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/x/settlements/batches/{id}:
    get:
      tags: [Admin settlement]
      operationId: adminGetSettlementBatch
      summary: "Batch kèm từng dòng đã đối chiếu và chênh lệch mở"
      security:
        - adminSession: []
        - adminBearer: []
      x-permission: settlement.read
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200":
          description: "Chi tiết batch."
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/x/settlements/discrepancies:
    get:
      tags: [Admin settlement]
      operationId: adminListDiscrepancies
      summary: "Chênh lệch đối soát kèm lịch sử"
      security:
        - adminSession: []
        - adminBearer: []
      x-permission: settlement.read
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [open, resolved] } }
        - { name: kind, in: query, schema: { type: string, enum: [missing, amount_mismatch, unexpected, overpaid, late_after_cancel] } }
        - { name: source, in: query, schema: { $ref: "#/components/schemas/SettlementSource" } }
        - { name: batch_id, in: query, schema: { type: string, maxLength: 128 } }
        - { name: order_id, in: query, schema: { type: string, maxLength: 128 } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: "Danh sách chênh lệch."
          content:
            application/json:
              schema:
                type: object
                properties:
                  discrepancies: { type: array, items: { type: object, additionalProperties: true } }
                  count: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/x/settlements/discrepancies/{id}/resolve:
    post:
      tags: [Admin settlement]
      operationId: adminResolveDiscrepancy
      summary: "Đóng chênh lệch có lý do (open → resolved một lần)"
      description: "Cần `exception.resolve` và `settlement.read`. Không động tới tiền. Lần sau → 409 `INVALID_STATE`."
      security:
        - adminSession: []
        - adminBearer: []
      x-permission: exception.resolve
      x-also-permissions: [settlement.read]
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [note]
              properties:
                note: { type: string, minLength: 3, maxLength: 500 }
                evidence_ref: { type: string, minLength: 3, maxLength: 128 }
      responses:
        "200":
          description: "Chênh lệch đã đóng."
          content:
            application/json:
              schema:
                type: object
                properties:
                  discrepancy: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/x/reports/summary:
    get:
      tags: [Admin settlement]
      operationId: adminReportSummary
      summary: "Báo cáo tiền tách theo định nghĩa"
      description: "Mỗi chỉ số lọc theo thời điểm phát sinh của chính nó trong [from, to)."
      security:
        - adminSession: []
        - adminBearer: []
      x-permission: report.read
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: "Báo cáo."
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/x/reports/exceptions:
    get:
      tags: [Admin settlement]
      operationId: adminReportExceptions
      summary: "Dashboard ngoại lệ vận hành, đối soát và COD chưa đối soát đủ"
      security:
        - adminSession: []
        - adminBearer: []
      x-permission: exception.read
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [ops, settlement, cod] } }
        - { name: kind, in: query, schema: { type: string, pattern: "^[a-z_]{1,40}$" } }
        - { name: priority, in: query, schema: { type: string, enum: [low, normal, high, urgent] } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: "Danh sách ngoại lệ và `by_kind`."
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  # ---------------------------------------------------------------- admin: security
