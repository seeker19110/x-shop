external_tables:
  _note: Bảng của Medusa 2.22.1 (node_modules, không có migration trong repo) — chỉ liệt kê, KHÔNG đối chiếu máy; cột liệt kê dựa trên mã x-shop ghi vào chúng, chưa đối chiếu schema Medusa (chưa xác minh)
  order_address:
    pii_columns:
      - first_name
      - phone
      - address_1
      - city
      - province
      - metadata
    source: apps/backend/src/workflows/checkout/submit-checkout.ts (shipping_address của đơn native)
    legal_basis: contract
    retention: contact-anonymize
    recipients:
      - ghn
    note: bản sao họ tên/SĐT/địa chỉ của order_finance; ẩn danh phải xử lý cả hai nơi
  order:
    pii_columns:
      - metadata.x_contact_email
      - customer_id
    source: submit-checkout.ts (metadata.x_contact_email; customer_id chỉ khi khách đăng nhập)
    legal_basis: contract
    retention: contact-anonymize
    recipients: []
  user:
    pii_columns:
      - email
      - first_name
      - last_name
      - avatar_url
    source: tài khoản admin của nhân viên (medusa user / lời mời)
    legal_basis: legitimate_interests
    retention: staff-account
    recipients: []
  auth_identity:
    pii_columns:
      - provider_identity.entity_id (email)
      - provider_identity.provider_metadata (băm mật khẩu)
      - app_metadata
    source: Auth Module của Medusa (đăng nhập admin, bí mật TOTP mã hoá bằng AUTH_MFA_ENCRYPTION_KEY)
    legal_basis: legitimate_interests
    retention: staff-account
    recipients: []
  invite:
    pii_columns:
      - email
    source: lời mời nhân viên của Medusa
    legal_basis: legitimate_interests
    retention: staff-account
    recipients: []
  customer:
    pii_columns:
      - email
      - first_name
      - last_name
      - phone
      - addresses
    source: chỉ nếu bật khách đăng nhập (storefront hiện mua không cần tài khoản — chưa xác minh luồng đăng ký)
    legal_basis: contract
    retention: contact-anonymize
    recipients: []
