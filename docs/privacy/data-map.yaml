# data-map.yaml — sổ dữ liệu cá nhân (CMP-PRIV-001, CMP-INTL-002, STD-PRIV-002, BASE-SEC-013)
# Sinh lần đầu từ migration thật; sửa tay khi schema đổi — script scripts/check-data-map.mjs bắt cột chưa phân loại.
# Cột PII: category (basic|sensitive|children), purpose, legal_basis (GDPR Art. 6), retention (khoá trong retention_classes),
# recipients (id trong docs/compliance/vendors.yaml), copies (nơi sao chép). Không có dữ liệu nhạy cảm (Art. 9) ở P0.
# Khi thêm cột PII: khai ở `pii`, thêm dòng vào docs/compliance/data-inventory.csv (đúng nội dung), ghi docs/privacy/CHANGELOG.md.
version: 1
updated: 2026-10-26
scope: Sổ dữ liệu cá nhân theo bảng/cột của x-shop. Mọi cột trong migration của apps/backend phải nằm ở `pii` hoặc `non_pii` — kiểm bằng `node scripts/check-data-map.mjs`. legal_basis và retention là ĐỀ XUẤT KỸ THUẬT, pháp chế xác nhận trước G7 (nguồn luật chưa xác minh — xem PROJECT.md §6, DPIA §9).
retention_classes:
  rate-limit-2d:
    rule: xoá bản ghi quá 2 ngày
    enforced: job x-order-access-cleanup (mỗi giờ) — đã thực thi
    status: đã thực thi
  contact-anonymize:
    rule: ẩn danh hoá họ tên/SĐT/email/địa chỉ chi tiết sau khi hết hạn đổi trả và hết nghĩa vụ liên quan đơn; giữ tiền, mã, trạng thái; số ngày đọc từ cấu hình (đề xuất mặc định theo luật VN hiện hành — nguồn luật chưa xác minh)
    enforced: chưa có job (PLAN-2 Q-20, task job ẩn danh + E2E rights-*)
    status: đề xuất — pháp chế xác nhận trước G7
  order-record:
    rule: "giữ theo nghĩa vụ lưu chứng từ kế toán/đơn hàng (số năm: chưa xác minh, pháp chế/kế toán xác nhận); sau đó xoá hoặc ẩn danh"
    enforced: chưa có job
    status: đề xuất — pháp chế xác nhận trước G7
  payment-evidence:
    rule: "giữ cùng thời hạn chứng từ thanh toán/đối soát (số năm: chưa xác minh, kế toán xác nhận); append-only theo thiết kế"
    enforced: chưa có job
    status: đề xuất — pháp chế xác nhận trước G7
  transient-90d:
    rule: "bản ghi vận hành tạm: xoá sau 90 ngày kể từ khi đóng/gửi xong"
    enforced: chưa có job
    status: đề xuất
  audit-1y:
    rule: nhật ký kiểm toán giữ tối thiểu 1 năm; bảng append-only bằng trigger DB nên xoá cần quy trình riêng
    enforced: chưa có job
    status: đề xuất
  staff-account:
    rule: giữ trong thời gian tài khoản nhân viên còn hiệu lực; xoá/ẩn danh khi nhân viên nghỉ theo quy trình offboarding
    enforced: chưa có job; thu hồi quyền thủ công
    status: đề xuất
  model-release:
    rule: giữ trong thời hạn hợp đồng/giấy cho phép của người mẫu; xoá số đo khi sản phẩm/ảnh ngừng dùng
    enforced: chưa có job
    status: đề xuất — cần hợp đồng người mẫu (chủ dự án)
tables:
  audit_log:
    system: x-shop/backend/audit
    pii:
      actor_id:
        category: basic
        purpose: định danh (giả danh) nhân viên thực hiện thao tác để kiểm toán, truy vết, chống gian lận
        legal_basis: legitimate_interests
        retention: audit-1y
        recipients: &a1 []
        copies: không
      reason:
        category: basic
        purpose: lý do thao tác quản trị (ghi chú tự do của nhân viên/khách, có thể chứa PII; khi trả ra đi qua maskFreeText)
        legal_basis: legitimate_interests
        retention: audit-1y
        recipients: []
        copies: không
      ip_hash:
        category: basic
        purpose: IP của người thao tác ở dạng băm — truy vết và chống gian lận
        legal_basis: legitimate_interests
        retention: audit-1y
        recipients: []
        copies: không
      user_agent:
        category: basic
        purpose: User-Agent của request (cắt ≤ 256 ký tự, đã che email/SĐT lẫn trong chuỗi) — nguồn của sự kiện bảo mật, phát hiện phiên/thiết bị lạ
        legal_basis: legitimate_interests
        retention: audit-1y
        recipients: []
        copies: không
      resource_id:
        category: basic
        purpose: đích của thao tác — có thể là id khách/nhân viên hoặc bí danh HMAC của email đăng nhập (idh_…, không lưu email thô) để gom các lần đăng nhập vào một tài khoản
        legal_basis: legitimate_interests
        retention: audit-1y
        recipients: []
        copies: không
    non_pii:
